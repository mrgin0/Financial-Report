<div class="auth-wrap">
  <div class="auth-card card">
    <div style="text-align:center;margin-bottom:18px">
      <div class="logo-ic" style="margin:0 auto 10px;width:44px;height:44px;font-size:20px">📊</div>
      <h2 style="margin-bottom:2px">Masuk</h2>
      <div style="font-size:12px;color:var(--mu)">Lap. Keuangan Pribadi</div>
    </div>
    <div class="fg"><label>Email</label><input type="email" id="login-email" placeholder="nama@email.com"></div>
    <div class="fg"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••"></div>
    <button class="btn-add" style="width:100%;justify-content:center;margin-top:6px" onclick="doLogin()">Masuk</button>

    <div style="text-align:center;margin-top:12px;font-size:12px">
      <a href="#" onclick="showForgotPassword();return false" style="color:var(--pr)">Lupa password?</a>
    </div>
    <div style="text-align:center;margin-top:6px;font-size:12px;color:var(--mu)">
      Belum punya akses? <a href="#" onclick="authNav('register');return false" style="color:var(--pr);font-weight:700">Daftar</a>
    </div>

    <div id="forgot-box" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)">
      <div class="fg"><label>Email buat kirim link reset password</label><input type="email" id="forgot-email" placeholder="nama@email.com"></div>
      <button class="btn-add" style="width:100%;justify-content:center;background:var(--bg);color:var(--txt);border:1px solid var(--bd)" onclick="doForgotPassword()">Kirim Link Reset</button>
    </div>
  </div>
</div>
