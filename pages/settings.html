<div class="page active" id="page-settings">
  <div class="ptitle">⚙️ <span>Setting</span></div>
  <div class="card" style="max-width:560px">
    <div class="ctitle" style="margin-bottom:14px">Profil &amp; Tampilan Aplikasi</div>

    <div class="fg"><label>Nama Aplikasi</label><input id="set-app-name" placeholder="Lap. Keuangan Pribadi"></div>
    <div class="fg"><label>Deskripsi Aplikasi</label><input id="set-app-desc" placeholder="Personal Finance Tracker"></div>

    <div class="fg"><label>Nama Akun</label><input id="set-acc-name" placeholder="Raihan Nor Falah"></div>
    <div class="fg"><label>Email Akun</label><input id="set-acc-email" placeholder="nama@email.com"></div>

    <div class="fg">
      <label>Foto Profil (Header)</label>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="set-avatar-preview" style="width:48px;height:48px;border-radius:50%;background:var(--pr);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden;flex-shrink:0">R</div>
        <input type="file" id="set-avatar-file" accept="image/*" onchange="previewSettingImage('set-avatar-file','set-avatar-preview')">
      </div>
    </div>

    <div class="fg">
      <label>Logo Family Office (Sidebar)</label>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="set-fologo-preview" style="width:70px;height:70px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:9px;text-align:center;overflow:hidden;flex-shrink:0">Belum ada</div>
        <input type="file" id="set-fologo-file" accept="image/*" onchange="previewSettingImage('set-fologo-file','set-fologo-preview')">
      </div>
      <div style="font-size:10px;color:var(--mu);margin-top:5px">Jika diisi, logo ini otomatis menggantikan teks "MI&amp;RAI CAPITAL" di sidebar.</div>
    </div>

    <div class="mbtns" style="justify-content:flex-start;margin-top:8px">
      <button class="mb-s" onclick="saveAppSettings()">💾 Simpan Pengaturan</button>
      <button class="mb-c" onclick="resetAppSettings()">↺ Reset ke Default</button>
    </div>
  </div>
</div>
</main>
