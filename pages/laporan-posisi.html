<div class="page active" id="page-laporan">
  <div class="ptitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span data-i="laporan_pos">Laporan Posisi Keuangan</span></div>

  <div class="card mb12">
    <div class="ctitle" style="margin-bottom:9px">Filter Periode</div>
    <div class="filt-3col">
      <div class="filt-fg" style="margin-bottom:0"><label>Periode</label>
        <select id="lap-period" onchange="onLapPeriodChange()">
          <option value="bulan_ini">Bulan Ini</option>
          <option value="bulan_lalu">Bulan Lalu</option>
          <option value="1y">1 Tahun Terakhir</option>
          <option value="all">Semua</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <div class="filt-fg" style="margin-bottom:0"><label>Dari Tanggal</label><input type="date" id="lap-from" disabled></div>
      <div class="filt-fg" style="margin-bottom:0"><label>Sampai Tanggal</label><input type="date" id="lap-to" disabled></div>
    </div>
    <button class="btn-filt" style="margin-top:9px;max-width:220px" onclick="applyLapFilter()">🔽 Terapkan Filter</button>
  </div>

  <div class="card mb12">
    <div class="chd"><div class="ctitle" data-i="laporan_detail">Laporan Posisi Keuangan</div><div class="cmonth" id="lap-month">—</div></div>
    <div id="fin-lap"></div>
  </div>

  <div class="card mb12">
    <div class="chd"><div class="ctitle">Laporan Laba Rugi</div><div class="cmonth" id="lr-month">—</div></div>
    <div id="fin-lr"></div>
  </div>

  <div class="card mb12">
    <div class="chd"><div class="ctitle">Laporan Arus Kas</div><div class="cmonth" id="ak-month">—</div></div>
    <div id="fin-ak"></div>
  </div>

  <div class="btn-row"><button class="btn btn-do" onclick="downloadPDF('all')" data-i="btn_pdf">📄 Download PDF</button></div>
</div>
