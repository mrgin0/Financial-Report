<div class="page active" id="page-laporan">
  <div class="ptitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span data-i="laporan_pos">Laporan Posisi Keuangan</span></div>
  <div class="card mb12">
    <div class="ctitle" style="margin-bottom:9px">Filter Periode</div>
    <div class="fr" style="grid-template-columns:1fr 1fr 1fr;align-items:end">
      <div class="filt-fg" style="margin-bottom:0"><label>Periode Bulan</label><input type="month" id="lap-pick" class="mpick" style="width:100%" onchange="onLapMonth(this.value)"></div>
      <div class="filt-fg" style="margin-bottom:0"><label>Dari Tanggal</label><input type="date" id="lap-f-from"></div>
      <div class="filt-fg" style="margin-bottom:0"><label>Sampai Tanggal</label><input type="date" id="lap-f-to"></div>
    </div>
    <button class="btn-filt" style="margin-top:9px;max-width:220px" onclick="lapDateFilter()">🔽 Terapkan Filter Tanggal</button>
  </div>
  <div class="card">
    <div class="chd">
      <div><div class="ctitle" data-i="laporan_detail">Laporan Detail</div><div class="cmonth" id="lap-month">—</div></div>
      <div class="dwrap">
        <div class="pbtns">
          <button class="pb" onclick="lapRange('1m',this)" data-i="p_1b">1 Bln</button>
          <button class="pb" onclick="lapRange('6m',this)" data-i="p_6b">6 Bln</button>
          <button class="pb" onclick="lapRange('1y',this)" data-i="p_1t">1 Thn</button>
          <button class="pb" onclick="lapRange('5y',this)" data-i="p_5t">5 Thn</button>
          <button class="pb" onclick="lapRange('all',this)" data-i="p_all">All</button>
        </div>
      </div>
    </div>
    <div id="fin-lap"></div>
    <div class="btn-row"><button class="btn btn-do" onclick="downloadPDF('lap')" data-i="btn_pdf">📄 Download PDF</button></div>
  </div>
</div>
