<div class="page active" id="page-exp">
  <div class="chd" style="margin-bottom:13px">
    <div class="ptitle" style="margin-bottom:0">📤 <span>Pengeluaran Uang</span></div>
    <button class="btn-add" onclick="openM('exp')">+ Tambah Pengeluaran</button>
  </div>
  <div class="sg">
    <div class="sc"><div class="sc-inf"><div class="sc-lbl">Total Pengeluaran</div><div class="sc-val" id="sc-exp-total">Rp 0</div><div class="sc-chg neu" id="sc-exp-total-chg">—</div></div><div class="sc-ic ic-o">💼</div></div>
    <div class="sc"><div class="sc-inf"><div class="sc-lbl">Rata-rata per Hari</div><div class="sc-val" id="sc-exp-avg">Rp 0</div><div class="sc-chg neu" id="sc-exp-avg-chg">—</div></div><div class="sc-ic ic-p">📅</div></div>
    <div class="sc"><div class="sc-inf"><div class="sc-lbl">Transaksi</div><div class="sc-val" id="sc-exp-count">0</div><div class="sc-chg neu" id="sc-exp-count-chg">—</div></div><div class="sc-ic ic-g">📋</div></div>
    <div class="sc"><div class="sc-inf"><div class="sc-lbl">Pengeluaran Hari Ini</div><div class="sc-val" id="sc-exp-today">Rp 0</div><div class="sc-chg neu" id="sc-exp-today-chg">—</div></div><div class="sc-ic ic-b">📄</div></div>
  </div>
  <div class="card mb12">
    <div class="chd"><div class="ctitle">Analisis Pengeluaran — Trend &amp; Kategori</div>
      <div class="pbtns" id="exp-per-btns">
        <button class="pb active" onclick="setTxPeriod('exp','7d',this)">7H</button>
        <button class="pb" onclick="setTxPeriod('exp','30d',this)">30H</button>
        <button class="pb" onclick="setTxPeriod('exp','1y',this)">1T</button>
        <button class="pb" onclick="setTxPeriod('exp','all',this)">ALL</button>
      </div>
    </div>
    <div class="chart-2col">
      <div class="chart-h"><canvas id="c-exp-trend"></canvas></div>
      <div class="donut-wrap">
        <canvas id="c-exp-donut" width="170" height="170" style="max-width:170px"></canvas>
        <div id="exp-donut-legend" style="width:100%;font-size:11.5px"></div>
        <div style="display:flex;justify-content:space-between;width:100%;font-weight:700;font-size:12.5px;border-top:1px solid var(--bd);margin-top:2px;padding-top:8px"><span>Total</span><span id="exp-donut-total">Rp 0</span></div>
      </div>
    </div>
    <div style="text-align:right;margin-top:6px"><button class="btn-add" style="background:var(--bg);color:var(--txt);border:1px solid var(--bd)" onclick="openCatMgr('exp')">⚙ Kelola Kategori</button></div>
  </div>
  <div class="tx-layout">
    <div class="card">
      <div class="ctitle" style="margin-bottom:9px">Riwayat Pengeluaran</div>
      <div class="tw"><table class="ct" id="t-exp"></table></div>
    </div>
    <div class="card">
      <div class="ctitle" style="margin-bottom:10px">Filter</div>
      <div class="filt-fg"><label>Periode</label><select id="exp-f-period"><option value="bulan_ini">Bulan Ini</option><option value="bulan_lalu">Bulan Lalu</option><option value="all">Semua</option><option value="custom">Custom</option></select></div>
      <div class="filt-fg"><label>Dari Tanggal</label><input type="date" id="exp-f-from"></div>
      <div class="filt-fg"><label>Sampai Tanggal</label><input type="date" id="exp-f-to"></div>
      <div class="filt-fg"><label>Kategori</label><select id="exp-f-cat"><option value="">Semua Kategori</option></select></div>
      <div class="filt-fg"><label>Metode Pembayaran</label><select id="exp-f-method"><option value="">Semua Metode</option></select></div>
      <button class="btn-filt" onclick="applyTxFilter('exp')">🔽 Terapkan Filter</button>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="ctitle" style="margin-bottom:4px">Ringkasan Pengeluaran berdasarkan Kategori</div>
    <div class="rgk-grid" id="exp-rgk"></div>
  </div>
</div>
